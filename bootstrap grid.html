<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <style>
        .layout { height: 500px;}
    </style>
<body>
    <h3>Grid</h3>

    <!-- grid -->
    <div class="container bg-primary my-5">
        <div class="grid grid-cols-3">
            <div class="card">card 1</div>
            <div class="card">card 2</div>
            <div class="card">card 3</div>
            <div class="card">card 4</div>
            <div class="card">card 5</div>
        </div>
    </div>

    <!-- row col concept -->
    <div class="container bg-primary">
        <div class="row g-3 text-center">
            <div class="card col-12 sm:col-6 md:col-4 lg:col-3">.sm:col-6 .md:col-4</div>
            <div class="card sm:col-6 md:col-4">.sm:col-6 .md:col-4</div>
            <div class="card sm:col-6 md:col-4">.sm:col-6 .md:col-4</div>
            <div class="card sm:col-6 md:col-4">.sm:col-6 .md:col-4</div>
        </div>
    </div>

    <!-- layout -->
    <div class="layout container my-12 p-4 bg-primary">
        <div class="text-2xl text-center p-4">Layout</div>
        <div class="card">Navbar</div>
        <div class="row h-75 p-4">
            <div class="card col-3">Side bar</div>
            <div class="card col-9">main</div>
        </div>
        <div class="card">Footer</div>
    </div>



</body>

</html>
