<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <h3>Condition</h3>

    <script>
        let marks = 75

        // if
        if ( marks > 40 ) {
             document.write("u r pass") 
        }

        // if else
        if ( marks > 40 ) {
             document.write("u r pass") 
        } else {
            document.write("Fail")  
        }

        // nested if
        if (marks >80){
            document.write("A+") 
        } else if (marks >70) {
            document.write("A") 
        } else if (marks >60) {
            document.write("B") 
        }else if (marks >60) {
            document.write("C") 
        } else {
            document.write("Fail")  
        }

        // switch statement
        let light = "purple"

        switch(light){
            case "red" : 
                document.write("ruk jao")
                break;
            case "yellow" :
                document.write("tyar rho") 
                break;
            case "green" : 
                document.write("bhago !!!") 
                break;
            default : 
                document.write("wrong color") 
        }

    </script>
</body>
</html>
