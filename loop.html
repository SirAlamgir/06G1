<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    <h3>Loop</h3>

    <script>
        // normal
        document.write("2 X 1 = 2")
        document.write("2 X 2 = 4")
        document.write("2 X 3 = 6")

        // loop
        let table = 50
        for( let i = 1 ; i <= 30 ; i++ ) {
            document.write( "<br> " + table + " X " + i + " = " + table*i )
        }

        // while
        let a = 8
        while( a < 10 ){
            console.log( a )
            a++
        }

        // do while
        do {
            console.log( a )
            a++
        } while(a < 10)

    </script>
</body>
</html>
